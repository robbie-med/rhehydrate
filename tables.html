<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="description" content="Clinical reference tables for pediatric dehydration assessment and rehydration, including severe acute malnutrition." />
  <title>Clinical Reference Tables · PRhehydrate</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="stylesheet" href="css/styles.css?v=1.10.0" />
  <script>
    try { var th = localStorage.getItem("rh.theme") || "system";
      if (th === "system") th = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", th); } catch (e) {}
  </script>
</head>
<body>

  <header class="topbar">
    <div class="topbar-left">
      <a href="index.html" class="iconbtn" id="backBtn" aria-label="Back to calculator" title="Back to calculator">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
      </a>
      <div class="brand">
        <img src="icon.svg" alt="" class="brand-mark" width="28" height="28" />
        <div class="brand-text">
          <span class="brand-name">PRhehydrate</span>
          <span class="brand-tag" id="pageTag">Clinical Reference Tables</span>
        </div>
      </div>
    </div>
    <nav class="topnav" id="topNav" aria-label="Theme and language">
      <div class="segmented small" id="themeSeg" role="group" aria-label="Color theme">
        <button class="seg" data-theme-val="system">System</button>
        <button class="seg" data-theme-val="light">Light</button>
        <button class="seg" data-theme-val="dark">Dark</button>
      </div>
      <button class="langtoggle" id="langBtn" aria-label="Change language">🇬🇧</button>
    </nav>
  </header>

  <div class="tables-page" id="tablesRoot"></div>

  <footer class="foot" id="footText">
    For clinical reference only. Verify all values against current authoritative sources before use. PRhehydrate is not a substitute for clinical judgment.
  </footer>

  <script>
    (function () {
      var STORAGE_KEY = 'rh.theme';

      function applyTheme(val) {
        var html = document.documentElement;
        if (val === 'light') {
          html.setAttribute('data-theme', 'light');
        } else if (val === 'dark') {
          html.setAttribute('data-theme', 'dark');
        } else {
          // system: remove explicit override, let CSS/media query decide
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          html.setAttribute('data-theme', prefersDark ? 'dark' : 'light');
        }
      }

      function syncSeg(val) {
        var btns = document.querySelectorAll('#themeSeg .seg');
        btns.forEach(function (btn) {
          var match = btn.getAttribute('data-theme-val') === val;
          btn.classList.toggle('active', match);
        });
      }

      function saved() { try { return localStorage.getItem(STORAGE_KEY) || 'system'; } catch (e) { return 'system'; } }

      // Restore saved theme on load
      applyTheme(saved());
      syncSeg(saved());

      // Wire segmented control
      document.getElementById('themeSeg').addEventListener('click', function (e) {
        var btn = e.target.closest('.seg[data-theme-val]');
        if (!btn) return;
        var val = btn.getAttribute('data-theme-val');
        try { localStorage.setItem(STORAGE_KEY, val); } catch (e2) {}
        applyTheme(val);
        syncSeg(val);
      });

      // React to system preference change when in "system" mode
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () {
        if (saved() === 'system') applyTheme('system');
      });
    })();
  </script>
  <script src="js/calc.js?v=1.10.0"></script>
  <script src="js/sam.js?v=1.10.0"></script>
  <script src="js/tables-kr.js?v=1.10.0"></script>
  <script src="js/tables-ru.js?v=1.10.0"></script>
  <script src="js/tables-zh.js?v=1.10.0"></script>
  <script src="js/tables.js?v=1.10.0"></script>

</body>
</html>
